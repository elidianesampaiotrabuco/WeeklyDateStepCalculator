<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Date Step Calculator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #111;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #666;
        }
        input[type="date"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="date"]:focus {
            border-color: #0066cc;
        }
        button.generate-btn {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 20px;
        }
        button.generate-btn:hover {
            background-color: #0052a3;
        }
        .results-box {
            border-top: 1px solid #eee;
            padding-top: 20px;
            display: none;
        }
        .step-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .step-item {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
        }
        .step-item:last-child {
            border-bottom: none;
        }
        .step-number {
            font-weight: 600;
            color: #0066cc;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .nav-btn {
            flex: 1;
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) {
            background-color: #e5e5e5;
            border-color: #b5b5b5;
        }
        .nav-btn:disabled {
            background-color: #fafafa;
            border-color: #e5e5e5;
            color: #ccc;
            cursor: not-allowed;
        }
        .page-info {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Weekly Date Calculator</h1>
    
    <div class="input-group">
        <div class="input-field">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" value="2011-01-05">
        </div>
        <div class="input-field">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate" value="2026-02-01">
        </div>
    </div>
    
    <button class="generate-btn" onclick="generateTimeline()">Calculate Steps</button>
    
    <div class="results-box" id="resultsBox">
        <ul class="step-list" id="stepList"></ul>
        
        <div class="controls">
            <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
            <span class="page-info" id="pageInfo">Steps 1-10</span>
            <button class="nav-btn" id="nextBtn" onclick="changePage(1)">Next</button>
        </div>
    </div>
</div>

<script>
    let allSteps = [];
    let currentPage = 0;
    const stepsPerPage = 10;

    function generateTimeline() {
        const startInput = document.getElementById('startDate').value;
        const endInput = document.getElementById('endDate').value;
        
        if (!startInput || !endInput) {
            alert('Please select both a start and an end date.');
            return;
        }
        
        let currentDate = new Date(startInput + 'T00:00:00');
        const endDate = new Date(endInput + 'T00:00:00');
        
        if (currentDate >= endDate) {
            alert('The start date must be earlier than the end date.');
            return;
        }
        
        allSteps = [];
        currentPage = 0;
        
        // Advance by 1 week per step until the target end date is breached
        while (true) {
            // Calculate next step date (7 days later)
            let nextDate = new Date(currentDate);
            nextDate.setDate(nextDate.getDate() + 7);
            
            if (nextDate > endDate) {
                break; // Stop if the next full step falls outside the timeline range
            }
            
            allSteps.push(nextDate);
            currentDate = nextDate;
        }
        
        if (allSteps.length === 0) {
            alert('The date range is too short to generate a 1-week milestone step.');
            return;
        }
        
        document.getElementById('resultsBox').style.display = 'block';
        renderPage();
    }

    function renderPage() {
        const stepList = document.getElementById('stepList');
        stepList.innerHTML = '';
        
        const startIndex = currentPage * stepsPerPage;
        const endIndex = Math.min(startIndex + stepsPerPage, allSteps.length);
        
        // Generate HTML list items for current page subset
        for (let i = startIndex; i < endIndex; i++) {
            const stepNum = i + 1;
            const formattedDate = allSteps[i].toLocaleDateString(undefined, {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                timeZone: 'UTC'
            });
            
            const li = document.createElement('li');
            li.className = 'step-item';
            li.innerHTML = `<span class="step-number">Step ${stepNum}</span> <span>${formattedDate}</span>`;
            stepList.appendChild(li);
        }
        
        // Update helper indicator text & manage navigation button states
        document.getElementById('pageInfo').innerText = `Steps ${startIndex + 1}-${endIndex} of ${allSteps.length}`;
        document.getElementById('prevBtn').disabled = currentPage === 0;
        document.getElementById('nextBtn').disabled = endIndex >= allSteps.length;
    }

    function changePage(direction) {
        currentPage += direction;
        renderPage();
    }
</script>

</body>
</html>
